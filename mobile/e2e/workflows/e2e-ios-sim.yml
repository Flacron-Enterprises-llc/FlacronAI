# Template — copy to mobile/.eas/workflows/ and set build_id (see ../README.md). Manual run only.
name: E2E iOS (simulator)
jobs:
  maestro_ios:
    name: Maestro on iOS simulator
    runs_on: macos-medium
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download
        with:
          build_id: REPLACE_WITH_E2E_IOS_SIMULATOR_BUILD_ID
          extensions: [app]
      - name: Boot simulator and install app
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP="${{ steps.download.outputs.artifact_path }}"
          [ -d "$APP" ] || APP=$(find "$APP" "$HOME" -maxdepth 4 -name "*.app" -type d 2>/dev/null | head -1)
          xcrun simctl install booted "$APP"
      - name: Install Maestro
        run: |
          java -version 2>/dev/null || brew install --quiet openjdk@17
          curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro flows
        run: |
          export PATH="$HOME/.maestro/bin:/opt/homebrew/opt/openjdk@17/bin:$PATH"
          cd "$(dirname "$(find . -maxdepth 3 -type d -name .maestro | head -1)")"
          R="$HOME/e2e-results"; mkdir -p "$R"; status=0
          for FLOW in .maestro/01-login-report-approve-export.yaml .maestro/02-isolation-profile-delete-ios.yaml; do
            NAME=$(basename "$FLOW" .yaml)
            maestro test "$FLOW" --format junit --output "$R/$NAME.xml" --test-output-dir "$R/$NAME" || status=1
          done
          mv ./*.png "$R"/ 2>/dev/null || true
          xcrun simctl spawn booted log show --last 20m --style compact --predicate 'process == "FlacronAI"' > "$R/ios-app.log" 2>/dev/null || true
          echo $status > "$R/exit_code"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          path: |
            /Users/expo/e2e-results
            /Users/expo/.maestro/tests
      - name: Fail if any flow failed
        run: exit $(cat "$HOME/e2e-results/exit_code" 2>/dev/null || echo 1)
