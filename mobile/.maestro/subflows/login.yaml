appId: com.flacronenterprises.flacronai
---
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn: "you@company.com"
- inputText: ${EMAIL}
# Tap the secure field itself (its placeholder) -- robust against iOS password autofill.
- tapOn: "••••••••••••"
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn: "Sign in"
# iOS may show its own Save Password sheet after sign-in.
- extendedWaitUntil:
    visible: "Welcome, .*|Not Now"
    timeout: 60000
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Welcome, .*"
    timeout: 60000
- tapOn:
    text: "Not now"
    optional: true
