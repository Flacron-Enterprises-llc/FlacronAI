name: iOS — App Store (TestFlight)

# Builds the FlacronAI iPhone app for the App Store against PRODUCTION (api.flacronai.com + Firebase flacronai-c8dab, the
# same accounts and data as flacronai.com and the Google Play build) and uploads it to App Store Connect / TestFlight.
#
# - Build profile `appstore` (mobile/eas.json): purchases only through Apple In-App Purchase (StoreKit, verified by the
#   backend), no website checkout link (App Review 3.1.1). Google sign-in uses the iOS OAuth client; Sign in with Apple is on.
# - No EAS build credits and no Mac needed: `expo prebuild` + CocoaPods + xcodebuild on a GitHub macOS runner, signed with
#   the team's Apple Distribution certificate and the "FlacronAI App Store" profile from environment secrets (temporary
#   keychain), uploaded with the App Store Connect API key.
# - The repository is PUBLIC: the IPA is never attached as a workflow artifact; build and upload run in one job.
# - It NEVER submits for App Review and never answers export compliance; release is done in App Store Connect.
on:
  push:
    branches:
      - release/ios-app-store
    paths:
      - "mobile/**"
      - "!mobile/**/*.md"
      - ".github/workflows/ios-app-store.yml"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion override (default: 100 + run number)"
        required: false
        default: ""
      upload:
        description: Upload to App Store Connect / TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-app-store
  cancel-in-progress: false

env:
  BUNDLE_ID: com.flacronenterprises.flacronai
  PROFILE_NAME: FlacronAI App Store

jobs:
  build-and-upload:
    name: Build, sign, verify and upload (macOS)
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
    runs-on: macos-26
    timeout-minutes: 90
    environment: ios-app-store
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Guard the branch
        working-directory: .
        run: '[ "$GITHUB_REF" = "refs/heads/release/ios-app-store" ] || { echo "App Store builds run only from release/ios-app-store"; exit 1; }'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 26+ (iOS 26 SDK required by App Store Connect)
        working-directory: .
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26+ on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | grep -qE '^(2[6-9]|[3-9][0-9])' || { echo "::error::iOS SDK below 26"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Checks (types, lint, unit tests)
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci

      - name: Load the `appstore` profile env from eas.json (production, public identifiers only)
        env:
          IN_BUILD: ${{ inputs.build_number }}
        run: |
          node -e '
            const env = require("./eas.json").build.appstore.env;
            if (env.EXPO_PUBLIC_WEB_BILLING) { console.error("App Store builds must not enable web billing"); process.exit(1); }
            const lines = Object.entries(env).map(([k, v]) => `${k}=${v}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
            console.log("loaded:", Object.keys(env).join(", "));
          '
          BUILD="${IN_BUILD:-$((100 + GITHUB_RUN_NUMBER))}"
          case "$BUILD" in ''|*[!0-9]*) echo "::error::build_number must be a positive integer"; exit 1;; esac
          echo "IOS_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Generate native iOS project (expo prebuild + CocoaPods)
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform ios --clean

      - name: Signing — distribution certificate + App Store profile (temporary keychain, never echoed)
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for v in P12_B64 P12_PASSWORD PROFILE_B64; do [ -n "${!v}" ] || { echo "::error::$v secret is missing"; exit 1; }; done
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          TEAM=$(plutil -extract TeamIdentifier.0 raw "$RUNNER_TEMP/profile.plist")
          [ "$NAME" = "$PROFILE_NAME" ] || { echo "::error::profile is '$NAME', expected '$PROFILE_NAME'"; exit 1; }
          plutil -extract Entitlements.aps-environment raw "$RUNNER_TEMP/profile.plist" >/dev/null || { echo "::error::profile has no Push Notifications entitlement"; exit 1; }
          plutil -extract Entitlements.com\\.apple\\.developer\\.applesignin raw "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1 \
            || plutil -p "$RUNNER_TEMP/profile.plist" | grep -q "com.apple.developer.applesignin" \
            || { echo "::error::profile has no Sign in with Apple entitlement"; exit 1; }
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" || { echo "::error::distribution identity not found"; exit 1; }
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      - name: Manual distribution signing on the app target only (Pods stay unsigned)
        run: |
          set -euo pipefail
          PROJ=$(ls -d ios/*.xcodeproj | grep -v Pods | head -1)
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open(ARGV[0])
            app = proj.targets.find { |t| t.product_type == "com.apple.product-type.application" } or abort("no app target")
            app.build_configurations.each do |c|
              next unless c.name == "Release"
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
            end
            proj.root_object.attributes["TargetAttributes"]&.each_value { |a| a["ProvisioningStyle"] = "Manual"; a["DevelopmentTeam"] = ENV["TEAM_ID"] }
            proj.save
            puts "signing set on #{app.name}"
          ' "$PROJ"
          echo "APP_TARGET=$(basename "$PROJ" .xcodeproj)" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -workspace "ios/$APP_TARGET.xcworkspace" -scheme "$APP_TARGET" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive"

      - name: Verify bundle id, version, entitlements, permissions, production config and absence of secrets
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/App.xcarchive"
          APP=$(ls -d "$A"/Products/Applications/*.app | head -1)
          P="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$P" | grep -qx "$BUNDLE_ID" || { echo "::error::wrong bundle id"; exit 1; }
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P")
          BLD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P")
          [ "$BLD" = "$IOS_BUILD_NUMBER" ] || { echo "::error::CFBundleVersion $BLD is not $IOS_BUILD_NUMBER"; exit 1; }
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Version $VER ($BLD)"
          echo "--- device families / usage descriptions"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$P" || true
          plutil -convert json -o - "$P" | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(k+": "+str(v)) for k,v in sorted(d.items()) if k.endswith("UsageDescription") or k in ("ITSAppUsesNonExemptEncryption","NSBonjourServices","UIBackgroundModes","CFBundleURLTypes")]'
          echo "--- entitlements"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$RUNNER_TEMP/ent.plist"
          plutil -p "$RUNNER_TEMP/ent.plist"
          grep -q "aps-environment" "$RUNNER_TEMP/ent.plist" || { echo "::error::push entitlement missing"; exit 1; }
          grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/ent.plist" || { echo "::error::Sign in with Apple entitlement missing"; exit 1; }
          if grep -q "get-task-allow</key>[[:space:]]*<true" "$RUNNER_TEMP/ent.plist"; then echo "::error::debug entitlement"; exit 1; fi
          codesign -dvv "$APP" 2>&1 | grep -E "^Authority=Apple Distribution" || { echo "::error::not signed with Apple Distribution"; exit 1; }

          BUNDLE_JS=$(find "$APP" -name 'main.jsbundle' | head -1)
          [ -n "$BUNDLE_JS" ] || { echo "::error::main.jsbundle not embedded"; exit 1; }
          for must in api.flacronai.com flacronai-c8dab 773892679617-12lrqave8s8l37gt87irhj8kaura2g64; do
            grep -aq "$must" "$BUNDLE_JS" || { echo "::error::bundle is missing $must"; exit 1; }
          done
          if grep -aqE 'flacronai-staging-qa|staging-api|demo-flacronai-e2e' "$BUNDLE_JS"; then echo "::error::staging/test endpoints in an App Store build"; exit 1; fi
          if grep -rlaE 'sk_live_|sk_test_[A-Za-z0-9]{10}|rk_(live|test)_[A-Za-z0-9]{10}|whsec_[A-Za-z0-9]{10}|sk-ant-[A-Za-z0-9_-]{10}|BEGIN (RSA |EC )?PRIVATE KEY|"private_key_id"|E2E_PASSWORD|trycloudflare|ngrok' "$APP"; then
            echo "::error::Forbidden secret/test material found in the app"; exit 1
          fi
          echo "Archived $BUNDLE_ID $VER ($BLD)" >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect API key (never echoed)
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          [ -n "$P8" ] || { echo "::error::APP_STORE_CONNECT_API_KEY_P8 secret is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          umask 077
          printf '%s' "$P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Export + upload to App Store Connect (TestFlight)
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 40
          echo "Uploaded build $IOS_BUILD_NUMBER ($VERSION) to App Store Connect (TestFlight processing takes 10–30 min). Not submitted for review." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key, keychain and profile
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/export"
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true

      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### iOS — App Store"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Bundle: \`${BUNDLE_ID}\` · version ${VERSION:-n/a} (${IOS_BUILD_NUMBER:-n/a})"
            echo "- IPA not attached (public repo)."
          } >> "$GITHUB_STEP_SUMMARY"
