name: Build and Push FlacronAI Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: flacronai-backend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build, push, and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- SLACK NOTIFICATION: DEPLOYMENT STARTED ---
      - name: Send Slack Notification - Deployment Started
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: "IN_PROGRESS"
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "🚀 FlacronAI Backend Deploy — STARTED"
          message_format: |
            *App / Repo:* <{repo_url}|{repo}>
            *Status:* 🟡 *Deployment In Progress...*
            *Branch:* `${{ github.ref_name }}`
            *Triggered by:* @${{ github.actor }}
            *Commit:* <{commit_url}|${{ github.sha }}>
            *Live Logs:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run Logs>
          footer: "Flacron Multi-App Deployment System | #app-deployment-notifications"
          notify_when: "always" # Forces Slack to send even when job state is IN_PROGRESS
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      # --- BUILD & DEPLOYMENT STEPS ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: FlacronAI-GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Pushed image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy new image to ECS
        run: |
          aws ecs update-service \
            --cluster flacronai-production-cluster \
            --service flacronai-backend-service \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster flacronai-production-cluster \
            --services flacronai-backend-service

      - name: Verify ECS service
        run: |
          aws ecs describe-services \
            --cluster flacronai-production-cluster \
            --services flacronai-backend-service \
            --query "services[0].{Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}" \
            --output table

      # --- SLACK NOTIFICATION: DEPLOYMENT FINISHED (SUCCESS / FAILURE) ---
      - name: Send Slack Notification - Deployment Finished
        if: always()
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "FlacronAI Backend Deploy — ${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"
          message_format: |
            *App / Repo:* <{repo_url}|{repo}>
            *Status:* ${{ job.status == 'success' && '🟢 SUCCESS' || '🔴 FAILED' }}
            *Branch:* `${{ github.ref_name }}`
            *Triggered by:* @${{ github.actor }}
            *Commit:* <{commit_url}|${{ github.sha }}>
            *Logs:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run Logs>
          footer: "Flacron Applications Deployment System | #app-deployment-notifications"
          notify_when: "success,failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

