name: Deploy FlacronAI (Azure + IBM)

# push main -> tests -> one scanned backend image -> Azure and IBM deploy in
# parallel, each independently. AWS deploys through deploy-backend.yml (backend)
# and Amplify (frontend); nothing here touches AWS. A failure on one cloud never
# blocks the other.

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-multicloud.yml"
      - ".github/workflows/backend-pr-validation.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Which cloud(s) to deploy
        type: choice
        options: [all, azure, ibm]
        default: all
      rollback_sha:
        description: Roll back by redeploying an already-built, previously verified commit SHA (skips tests/build)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: flacronai-multicloud-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.rollback_sha || github.sha }}

jobs:
  backend-ci:
    name: Backend tests
    if: ${{ !inputs.rollback_sha }}
    uses: ./.github/workflows/backend-pr-validation.yml

  frontend-ci:
    name: Frontend lint + tests
    if: ${{ !inputs.rollback_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      # Placeholder Firebase config so modules that initialise Firebase at
      # import time can load under test. Not real credentials.
      - run: npm test
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_APP_ID: "1:0:web:0"

  build-backend:
    name: Build + scan backend image
    needs: [backend-ci, frontend-ci]
    if: ${{ !inputs.rollback_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build --platform linux/amd64 --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "flacronai-backend:$GITHUB_SHA" ./backend
      - name: Vulnerability scan (fail on CRITICAL with an available fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flacronai-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flacronai-backend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Export image
        run: docker save "flacronai-backend:$GITHUB_SHA" | gzip -1 > backend-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 3

  # ─────────────────────────────── AZURE ───────────────────────────────
  azure:
    name: Deploy Azure
    needs: [build-backend]
    if: >-
      ${{ !cancelled()
          && (needs.build-backend.result == 'success' || (inputs.rollback_sha != '' && needs.build-backend.result == 'skipped'))
          && (inputs.target == '' || inputs.target == 'all' || inputs.target == 'azure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: azure-production
      url: ${{ vars.WEB_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.AZURE_ACR }}.azurecr.io/flacronai-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download scanned image
        if: ${{ !inputs.rollback_sha }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image

      - name: Push image to ACR
        if: ${{ !inputs.rollback_sha }}
        run: |
          gunzip -c backend-image.tar.gz | docker load
          az acr login -n "${{ vars.AZURE_ACR }}"
          docker tag "flacronai-backend:$RELEASE_SHA" "$IMAGE:$RELEASE_SHA"
          docker push "$IMAGE:$RELEASE_SHA"

      - name: Check rollback image exists
        if: ${{ inputs.rollback_sha }}
        run: az acr manifest show-metadata -r "${{ vars.AZURE_ACR }}" -n "flacronai-backend:$RELEASE_SHA" -o none

      - name: Record running image (rollback point)
        run: |
          PREV=$(az containerapp show -n "${{ vars.AZURE_CONTAINERAPP }}" -g "${{ vars.AZURE_RG }}" \
            --query 'properties.template.containers[0].image' -o tsv)
          echo "Previous image: $PREV"
          echo "PREVIOUS_IMAGE=$PREV" >> "$GITHUB_ENV"

      - name: Deploy API revision
        run: |
          az containerapp update -n "${{ vars.AZURE_CONTAINERAPP }}" -g "${{ vars.AZURE_RG }}" \
            --image "$IMAGE:$RELEASE_SHA" --revision-suffix "r${RELEASE_SHA:0:7}-${GITHUB_RUN_ATTEMPT}-${GITHUB_RUN_NUMBER}" -o none

      - name: Verify API serves this release
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsS "${{ vars.API_URL }}/health" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q "\"version\":\"$RELEASE_SHA\"" && exit 0
            sleep 10
          done
          echo "::error::Azure API is not serving $RELEASE_SHA"; exit 1

      - name: Roll back API
        if: failure() && env.PREVIOUS_IMAGE != ''
        run: |
          az containerapp update -n "${{ vars.AZURE_CONTAINERAPP }}" -g "${{ vars.AZURE_RG }}" \
            --image "$PREVIOUS_IMAGE" --revision-suffix "rollback-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" -o none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Azure API)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ vars.VITE_GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          npm ci --no-fund --no-audit
          npm run build
          cp staticwebapp.config.json dist/

      - name: Deploy frontend to Static Web Apps
        working-directory: frontend
        run: |
          SWA_CLI_DEPLOYMENT_TOKEN=$(az staticwebapp secrets list -n "${{ vars.AZURE_SWA }}" -g "${{ vars.AZURE_RG }}" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$SWA_CLI_DEPLOYMENT_TOKEN"
          export SWA_CLI_DEPLOYMENT_TOKEN
          npx --yes @azure/static-web-apps-cli@2.0.7 deploy ./dist --env production

      - name: Smoke test frontend
        run: |
          curl -fsS -o /dev/null "${{ vars.WEB_URL }}/"
          curl -fsS -o /dev/null "${{ vars.WEB_URL }}/pricing"
          echo "Azure frontend OK"

  # ──────────────────────────────── IBM ────────────────────────────────
  ibm:
    name: Deploy IBM Cloud
    needs: [build-backend]
    if: >-
      ${{ !cancelled()
          && (needs.build-backend.result == 'success' || (inputs.rollback_sha != '' && needs.build-backend.result == 'skipped'))
          && (inputs.target == '' || inputs.target == 'all' || inputs.target == 'ibm') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ibm-production
      url: ${{ vars.WEB_URL }}
    env:
      REGISTRY: us.icr.io/${{ vars.ICR_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      # Service ID `flacronai-deployer`: CE Writer on project flacronai-prod and
      # ICR Writer on namespace flacronai only.
      - name: IBM Cloud CLI login
        uses: IBM/actions-ibmcloud-cli@659dddde7a3f4532fafa34013be2e32f31b42cf9 # v2.2.0
        with:
          api_key: ${{ secrets.IBM_CLOUD_API_KEY }}
          region: ${{ vars.IBM_REGION }}
          group: ${{ vars.IBM_RESOURCE_GROUP }}
          plugins: code-engine, container-registry

      - name: Select Code Engine project + registry login
        run: |
          ibmcloud ce project select --name "${{ vars.IBM_CE_PROJECT }}"
          ibmcloud cr region-set us-south
          ibmcloud cr login

      - name: Download scanned image
        if: ${{ !inputs.rollback_sha }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image

      - name: Push backend image to ICR
        if: ${{ !inputs.rollback_sha }}
        run: |
          gunzip -c backend-image.tar.gz | docker load
          docker tag "flacronai-backend:$RELEASE_SHA" "$REGISTRY/flacronai-backend:$RELEASE_SHA"
          docker push "$REGISTRY/flacronai-backend:$RELEASE_SHA"

      - name: Build + push frontend image (IBM API)
        if: ${{ !inputs.rollback_sha }}
        run: |
          docker build --platform linux/amd64 -f frontend/Dockerfile.web \
            --build-arg VITE_API_URL="${{ vars.API_URL }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_MEASUREMENT_ID="${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}" \
            --build-arg VITE_GOOGLE_MAPS_BROWSER_KEY="${{ vars.VITE_GOOGLE_MAPS_BROWSER_KEY }}" \
            -t "$REGISTRY/flacronai-web:$RELEASE_SHA" ./frontend
          docker push "$REGISTRY/flacronai-web:$RELEASE_SHA"

      - name: Record running images (rollback point)
        run: |
          echo "PREVIOUS_API=$(ibmcloud ce app get -n flacronai-api -o json | jq -r '.spec.template.spec.containers[0].image')" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEB=$(ibmcloud ce app get -n flacronai-web -o json | jq -r '.spec.template.spec.containers[0].image')" >> "$GITHUB_ENV"

      - name: Deploy API
        run: |
          ibmcloud ce app update -n flacronai-api --image "$REGISTRY/flacronai-backend:$RELEASE_SHA" \
            --registry-secret icr-flacronai-pull --wait --wait-timeout 600

      - name: Verify API serves this release
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "${{ vars.API_URL }}/health" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q "\"version\":\"$RELEASE_SHA\"" && exit 0
            sleep 10
          done
          echo "::error::IBM API is not serving $RELEASE_SHA"; exit 1

      - name: Deploy frontend
        run: |
          ibmcloud ce app update -n flacronai-web --image "$REGISTRY/flacronai-web:$RELEASE_SHA" \
            --registry-secret icr-flacronai-pull --wait --wait-timeout 300
          curl -fsS -o /dev/null "${{ vars.WEB_URL }}/"
          curl -fsS -o /dev/null "${{ vars.WEB_URL }}/pricing"
          echo "IBM frontend OK"

      - name: Roll back
        if: failure() && env.PREVIOUS_API != ''
        run: |
          ibmcloud ce app update -n flacronai-api --image "$PREVIOUS_API" --registry-secret icr-flacronai-pull --wait --wait-timeout 600 || true
          if [ -n "$PREVIOUS_WEB" ]; then
            ibmcloud ce app update -n flacronai-web --image "$PREVIOUS_WEB" --registry-secret icr-flacronai-pull --wait --wait-timeout 300 || true
          fi
